name: govulncheck
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  schedule:
    # Run weekly on Monday at 07:00 UTC
    - cron: "0 7 * * 1"
jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # tag=v6.0.2
        with:
          fetch-depth: 2 # HEAD^1 of the PR merge commit is the base branch.
      - name: Calculate go version
        id: vars
        run: echo "go_version=$(make go-version)" >> $GITHUB_OUTPUT
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # tag=v7.0.0
        with:
          go-version: ${{ steps.vars.outputs.go_version }}
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        if: github.event_name != 'pull_request'
        run: govulncheck ./...
      # Fail only on vulnerabilities this PR adds to the base branch.
      - name: Run govulncheck for new vulnerabilities
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          called='select(.finding.trace[0].function) | .finding.osv'
          govulncheck -format json ./... | jq -r "$called" | sort -u > "$RUNNER_TEMP/head.txt"
          git checkout -q HEAD^1
          govulncheck -format json ./... | jq -r "$called" | sort -u > "$RUNNER_TEMP/base.txt"
          if [ -s "$RUNNER_TEMP/base.txt" ]; then
            echo "::warning::The base branch is affected by $(paste -sd ' ' "$RUNNER_TEMP/base.txt")"
          fi
          new=$(comm -13 "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt")
          if [ -n "$new" ]; then
            for id in $new; do
              echo "::error::This PR introduces $id: https://pkg.go.dev/vuln/$id"
            done
            exit 1
          fi
