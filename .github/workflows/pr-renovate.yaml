name: PR Renovate code generation and go modules fix

# Renovate cannot run make, and it tidies only the module it updates. This job runs
# make modules and make generate on Renovate branches and commits the result.
# Commits pushed with GITHUB_TOKEN do not start this workflow again.
on:
  push:
    branches:
      - renovate/**

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the generated changes to the Renovate branch.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Update all modules
        run: make modules
      - name: Update generated code
        run: make generate
      - name: Commit changes
        # Renovate keeps updating the branch only while this author is listed in
        # gitIgnoredAuthors in .github/renovate.json5.
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update generated code"
          git push origin "HEAD:${GITHUB_REF_NAME}"
